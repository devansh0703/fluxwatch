[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxwatch-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "structlog>=23.1.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
flask = ["flask>=3.0"]
fastapi = ["fastapi>=0.110"]
