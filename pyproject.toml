[project]
name = "fluxwatch"
version = "0.1.0"
description = "Trading System Observability Platform"
requires-python = ">=3.10"
dependencies = [
    "structlog>=23.1.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "click>=8.1",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
flask = ["flask>=3.0"]
fastapi = ["fastapi>=0.110"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-httpx>=0.30", "httpx>=0.27"]

[project.scripts]
fluxwatch = "cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "agent/tests"]
